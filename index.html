</script><script>'use strict';
const STORE='learning-trails-child-v2',app=document.getElementById('app');
const fresh=()=>({version:2,mode:'home',route:0,level:0,startedAt:null,phaseStart:null,finishedAt:null});
let state=fresh();
try{const old=JSON.parse(localStorage.getItem(STORE));if(old?.version===2&&Number.isInteger(old.route)&&old.route>=0&&old.route<DATA.length&&Number.isInteger(old.level)&&old.level>=0&&old.level<DATA[old.route].levels.length&&['home','intro','route','transition','break','wrap','done'].includes(old.mode))state={version:2,mode:old.mode,route:old.route,level:old.level,startedAt:old.startedAt,phaseStart:old.phaseStart,finishedAt:old.finishedAt};}catch{}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const route=()=>DATA[state.route],level=()=>route().levels[state.level];
const elapsed=()=>state.startedAt?Math.min(2400,Math.max(0,Math.floor(((state.finishedAt||Date.now())-state.startedAt)/1000))):0;
const clock=n=>`${Math.floor(Math.max(n,0)/60).toString().padStart(2,'0')}:${Math.floor(Math.max(n,0)%60).toString().padStart(2,'0')}`;
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch{}}
function header(){const active=!['home','done'].includes(state.mode);return `<header><span class="brand">学力探险<span>语文 · 数学</span></span><div class="row">${active?`<span class="clock" id="timer" aria-label="探险剩余时间">${clock(2400-elapsed())}</span><button class="ghost small" data-action="finish">结束探险</button>`:''}</div></header>`;}
function home(){return `${header()}<section class="welcome"><p class="eyebrow">每个人都有自己的起点</p><h1>准备好，<br>发现你会的本领。</h1><p class="lede">读一读，说一说，算一算。遇到不会的可以告诉老师，一起选择下一条路线。</p><button class="primary" data-action="start">开始探险</button><p class="small muted">准备好纸和笔 · 和老师一起完成 · 最多40分钟</p></section><div class="route-grid"><article><b>01 / 数学</b><h2>数量里的秘密</h2><p>加减 · 乘除 · 运用与图形</p></article><article><b>02 / 语文</b><h2>文字里的线索</h2><p>拼音 · 识字 · 阅读 · 书写</p></article></div>`;}
function begin(){state={...fresh(),mode:'intro',startedAt:Date.now(),phaseStart:Date.now()};save();render();}
function startRoute(i){state.route=i;state.level=0;state.mode='route';state.phaseStart=Date.now();save();render();}
function intro(){return `${header()}<section class="welcome"><p class="eyebrow">准备站</p><h1>不用每一道都会。</h1><p class="lede">你可以把答案说出来，也可以写在纸上。做完一关，和老师一起决定：继续挑战，还是换一条路线。</p><button class="primary" data-action="intro-next">我准备好了</button></section>`;}
function visual(type){const svg=(c,d,v='0 0 360 130')=>`<svg class="question-visual" viewBox="${v}" role="img" aria-label="${d}">${c}</svg>`;if(type==='dots')return svg(Array.from({length:8},(_,i)=>`<circle cx="${35+i%4*65}" cy="${35+Math.floor(i/4)*55}" r="13" fill="#2c4be9"/>`).join(''),'两行圆点，每行四个');if(type==='groups')return svg(Array.from({length:3},(_,i)=>`<rect x="${i*120+4}" y="10" width="106" height="105" rx="14" fill="#edf1ff"/>${Array.from({length:4},(_,j)=>`<circle cx="${i*120+33+j%2*45}" cy="${40+Math.floor(j/2)*43}" r="11" fill="#2c4be9"/>`).join('')}`).join(''),'三组圆点，每组四个');if(type==='shapes')return svg('<rect x="10" y="32" width="100" height="60" fill="#e9edff" stroke="#2c4be9" stroke-width="3"/><rect x="155" y="20" width="70" height="70" fill="#e9edff" stroke="#2c4be9" stroke-width="3"/><polygon points="300,18 258,90 342,90" fill="#e9edff" stroke="#2c4be9" stroke-width="3"/><text x="55" y="122">A</text><text x="182" y="122">B</text><text x="295" y="122">C</text>','A有两长边两短边，B四边相等，C有三条边');if(type==='perimeter')return svg('<rect x="70" y="35" width="160" height="80" fill="#e9edff" stroke="#2c4be9" stroke-width="3"/><text x="128" y="25">6厘米</text><text x="245" y="83">3厘米</text>','长6厘米，宽3厘米的长方形','0 0 350 140');return '';}
function routePage(){const r=route(),l=level();return `${header()}<nav class="route-nav" aria-label="路线进度">${DATA.map((x,i)=>`<span ${i===state.route?'aria-current="step"':''} class="${i===state.route?'active':''}">${i+1} ${x.short}</span>`).join('')}</nav><div class="row between"><div><p class="eyebrow">${r.subject} / ${r.name} / 第${state.level+1}关</p><h1 class="task-title">${l.name}</h1></div><span class="stage-clock" id="stage-timer">本站剩余 ${clock(r.minutes*60-(Date.now()-state.phaseStart)/1000)}</span></div><p class="muted">${r.intro}</p>${l.text?`<article class="reading-text">${esc(l.text)}</article>`:''}<div class="${r.id==='chars'?'character-grid':'questions'}">${l.items.map((q,i)=>`<article class="question ${q.char?'character':''}"><span class="question-number">${String(i+1).padStart(2,'0')}</span><div class="prompt">${esc(q.prompt)}</div>${q.visual?visual(q.visual):''}</article>`).join('')}</div><div class="next-choice"><p>做完后，和老师一起选下一步。</p><div class="row"><button class="primary" data-action="advance">${state.level+1<r.levels.length?'继续挑战':'去下一站'}</button>${state.level+1<r.levels.length?'<button data-action="change-route">换一条路线</button>':''}</div></div><p class="small muted">不用抢答，也不比速度。</p>`;}
function advance(){if(state.mode!=='route')return;const limit=Date.now()-state.phaseStart>=route().minutes*60000;if(limit){leaveRoute();return;}if(state.level+1<route().levels.length){state.level++;save();render();}else leaveRoute();}
function leaveRoute(){state.mode='transition';save();render();}
function transition(){const last=state.route===DATA.length-1;return `${header()}<section class="welcome"><p class="eyebrow">${route().name}</p><h1>这一站，先到这里。</h1><p class="lede">${last?'谢谢你的尝试。和老师聊聊刚才的发现吧。':state.route===2?'活动一下，喝口水。接下来我们去文字的世界。':'每条路线都不一样。准备好，我们去看看下一条。'}</p><button class="primary" data-action="next-route">${last?'聊聊今天的发现':state.route===2?'休息一下':'进入下一站'}</button></section>`;}
function nextRoute(){if(state.route===DATA.length-1){state.mode='wrap';state.phaseStart=Date.now();save();render();}else if(state.route===2){state.mode='break';state.phaseStart=Date.now();save();render();}else startRoute(state.route+1);}
function breakPage(){return `${header()}<section class="welcome"><p class="eyebrow">休息站 · 2分钟</p><h1>伸伸手，看看远处。</h1><p class="lede">喝口水，让眼睛离开屏幕。接下来是拼音、识字和阅读。</p><div class="break-clock" id="break-timer">${clock(120-(Date.now()-state.phaseStart)/1000)}</div><button class="primary" data-action="break-next">休息好了，继续</button></section>`;}
function wrap(){return `${header()}<section class="welcome"><p class="eyebrow">最后的发现</p><h1>今天发现了什么？</h1><p class="lede">哪一个任务你最有把握？哪个地方下次想再试试？</p><button class="primary" data-action="complete">完成探险</button></section>`;}
function done(){return `${header()}<section class="welcome"><p class="eyebrow">探险结束</p><h1>今天就到这里。</h1><p class="lede">谢谢你的尝试。合上本子，活动一下，和老师聊聊你最喜欢的任务吧。</p><button data-action="new">回到起点</button></section>`;}
function finish(){if(state.mode==='done')return;state.finishedAt=Date.now();state.mode='done';save();render();}
function render(){const views={home,intro,route:routePage,transition,break:breakPage,wrap,done};app.innerHTML=views[state.mode]();window.scrollTo({top:0,behavior:'instant'});}
app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action;if(a==='start')begin();else if(a==='intro-next'&&state.mode==='intro')startRoute(0);else if(a==='advance')advance();else if(a==='change-route'&&state.mode==='route'){if(confirm('这一站先到这里，去看看另一条路线吗？'))leaveRoute();}else if(a==='next-route'&&state.mode==='transition')nextRoute();else if(a==='break-next'&&state.mode==='break')startRoute(3);else if(a==='complete')finish();else if(a==='finish'){if(confirm('今天的探险先到这里吗？'))finish();}else if(a==='new'){state=fresh();save();render();}});
function tick(){if(!state.startedAt||state.finishedAt)return;if(elapsed()>=2400){finish();return;}const timer=document.getElementById('timer');if(timer)timer.textContent=clock(2400-elapsed());const dt=(Date.now()-state.phaseStart)/1000;if(state.mode==='intro'&&dt>=120)startRoute(0);else if(state.mode==='break'){const el=document.getElementById('break-timer');if(el)el.textContent=clock(120-dt);if(dt>=120)startRoute(3);}else if(state.mode==='wrap'&&dt>=120)finish();else if(state.mode==='route'){const el=document.getElementById('stage-timer');if(el)el.textContent='本站剩余 '+clock(route().minutes*60-dt);if(dt>=route().minutes*60)leaveRoute();}}
render();tick();setInterval(tick,1000);
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'get_assessment_progress',title:'读取探险进度',description:'读取当前路线、关卡与用时，不包含答案、评分或能力判断。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:input=>{if(!input||typeof input!=='object'||Array.isArray(input)||Object.keys(input).length)throw new Error('Expected an empty object');return {mode:state.mode,route:route().name,level:state.level+1,elapsedSeconds:elapsed()};}})).catch(()=>{});}catch{}}
</script></body></html>
