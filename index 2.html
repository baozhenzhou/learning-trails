</style></head><body><main id="app"></main><noscript>请使用启用 JavaScript 的浏览器打开游戏。</noscript><script>const DATA=[{"id":"number","name":"数与运算","subject":"数学","minutes":5,"sets":{"A":[{"id":"n-a1","title":"拆开看看","prompt":"47 里面有几个十、几个一？\n算一算：14 − 8；36 + 27。"},{"id":"n-a2","title":"分一分","prompt":"有 18 支笔，平均放进 3 个笔筒，每个笔筒有几支？写出算式。"}],"B":[{"id":"n-b1","title":"数里的位置","prompt":"在 508 和 580 中，哪个数大？说说你是怎样比较的。\n算一算：268 + 157；403 − 186。"},{"id":"n-b2","title":"算一算，说一说","prompt":"算一算：23 × 3；84 ÷ 4。\n选其中一道，说说你的方法。"},{"id":"n-b3","title":"先算哪一步","prompt":"算一算：36 ÷ 4 + 5。先算哪一步？"}],"C":[{"id":"n-c1","title":"小数与钱","prompt":"一支笔 2.5 元，一个橡皮 1.8 元。一起买要多少钱？付 5 元，应找回多少元？"},{"id":"n-c2","title":"同一块饼","prompt":"一块饼平均分成 8 份，小禾吃了其中 2 份，小宇吃了其中 3 份。两人共吃了这块饼的几分之几？还剩几分之几？"},{"id":"n-c3","title":"换个算法","prompt":"计算 25 × 12。你能把 12 拆开，说明为什么结果不变吗？"},{"id":"n-c4","title":"更大的数","prompt":"读出 30 405，指出其中的“4”表示什么。\n算一算：132 × 12；156 ÷ 12。"}]}},{"id":"shape","name":"数量与图形","subject":"数学","minutes":4,"sets":{"A":[{"id":"g-a1","title":"每盒一样多","prompt":"每盒有 6 支彩笔，2 盒共有几支？说说你怎样想。"},{"id":"g-a2","title":"看看边和角","prompt":"图中哪个是长方形，哪个是正方形？任选一个，说说它的边或角有什么特点。","visual":"shapes"}],"B":[{"id":"g-b1","title":"买练习本","prompt":"每本练习本 4 元，买 3 本，付给店员 20 元。应找回多少钱？先说你准备先求什么。"},{"id":"g-b2","title":"围一圈","prompt":"长方形卡片长 6 厘米、宽 3 厘米。沿四条边围一圈，彩带至少需要多少厘米？","visual":"rectangle"}],"C":[{"id":"g-c1","title":"铺满卡片","prompt":"仍是一张长 6 厘米、宽 3 厘米的长方形卡片。用边长 1 厘米的小正方形铺满，不重叠、无空隙，需要多少个？面积是多少？","visual":"rectangle"},{"id":"g-c2","title":"图形怎样动","prompt":"说说平移和旋转有什么不同，并各举一个生活例子。\n正方形有几条对称轴？可以在纸上画出来。"}]}},{"id":"data","name":"数据与生活","subject":"数学","minutes":3,"sets":{"A":[{"id":"d-a1","title":"看表找线索","prompt":"看表：哪一天借书最多？周二比周一多借几本？","table":[["日期","借书数量"],["周一","3 本"],["周二","6 本"],["周三","3 本"]]},{"id":"d-a2","title":"选个单位","prompt":"一本练习本大约重 80（克／千克）；一节课大约 40（分钟／小时）。选合适的单位。"}],"B":[{"id":"d-b1","title":"图书角记录","prompt":"看表：三天一共借出多少本书？周二比周一多借几本？","table":[["日期","借书数量"],["周一","3 本"],["周二","6 本"],["周三","3 本"]]},{"id":"d-b2","title":"活动用了多久","prompt":"阅读活动从 9:10 开始，到 9:35 结束，一共进行了多少分钟？"}],"C":[{"id":"d-c1","title":"平均分一分","prompt":"三天分别借出 3 本、6 本、3 本书。平均每天借出多少本？平均数是说每天实际都借出这么多吗？"},{"id":"d-c2","title":"方向和质量","prompt":"学校东面是书店，书店北面是公园。公园在学校的什么方向？\n2 千克苹果，吃了 500 克，还剩多少克？"}]}},{"id":"pinyin","name":"拼音线索","subject":"语文","minutes":1,"sets":{"A":[{"id":"p-a1","title":"读一读","prompt":"读出：b　d　mā　mǎ。"}],"B":[{"id":"p-b1","title":"读出音节","prompt":"读出：zhī　chuān　yuè。"},{"id":"p-b2","title":"给字写拼音","prompt":"在纸上给“水”写拼音，标上声调。"}],"C":[{"id":"p-c1","title":"字母顺序","prompt":"按《汉语拼音字母表》的顺序排列：H、J、I，并写出对应的小写字母。"}]}},{"id":"words","name":"字词工具箱","subject":"语文","minutes":3,"sets":{"A":[{"id":"w-a1","title":"熟悉的词","prompt":"读出：方向、朋友、明亮。选择一个词说一句话。"},{"id":"w-a2","title":"找一个字","prompt":"用字典查“山”（shān）。先说准备查哪个大写字母，再动手找到这个字。"}],"B":[{"id":"w-b1","title":"读词，说意思","prompt":"读出：旅途、附近、整齐、勇敢。\n“操场十分安静。”这里的“安静”是什么意思？"},{"id":"w-b2","title":"用字典找一找","prompt":"用音序检字法查“明”（míng），找到它在“明亮”中的意思，说说你的查找步骤。"}],"C":[{"id":"w-c1","title":"换一种查法","prompt":"用部首检字法查“桥”，找到后读出它，说明查找步骤。"},{"id":"w-c2","title":"同一个字","prompt":"“明亮”与“明白”中的“明”，意思一样吗？说说两个词的意思。"}]}},{"id":"reading","name":"故事里的发现","subject":"语文","minutes":6,"sets":{"A":[{"id":"r-a1","title":"找找故事中的事","prompt":"从故事里找一找：小禾发现了什么问题？她最先做了什么？","passage":"午后，小禾抱着几本书来到教室的图书角。她刚把书放下，就发现窗边的地上有一小摊水，最下面一本书的封面也湿了。她抬头看了看，原来窗户没关，刚才的雨飘了进来。小禾先关好窗，又拿来干布，轻轻吸去封面上的水。她想把湿书放到太阳下晒，却想起老师说过，湿书猛晒容易变形。于是，她把书翻开，放在通风的地方。小宇走过来，问她怎么不去操场玩。小禾指了指书，说：“等它们安顿好了，我就去。”第二天，书页干了，虽然还有一点皱，大家仍能接着读。小宇在窗边贴了一张小纸条：“离开前，请看看窗户。”"},{"id":"r-a2","title":"把事情连起来","prompt":"看着故事，说说“发现书湿了—照顾湿书—第二天”的经过。","passage":"午后，小禾抱着几本书来到教室的图书角。她刚把书放下，就发现窗边的地上有一小摊水，最下面一本书的封面也湿了。她抬头看了看，原来窗户没关，刚才的雨飘了进来。小禾先关好窗，又拿来干布，轻轻吸去封面上的水。她想把湿书放到太阳下晒，却想起老师说过，湿书猛晒容易变形。于是，她把书翻开，放在通风的地方。小宇走过来，问她怎么不去操场玩。小禾指了指书，说：“等它们安顿好了，我就去。”第二天，书页干了，虽然还有一点皱，大家仍能接着读。小宇在窗边贴了一张小纸条：“离开前，请看看窗户。”"}],"B":[{"id":"r-b1","title":"默读小故事","prompt":"先默读这篇故事，再说说：书为什么湿了？小禾为什么没有把书放到太阳下猛晒？","passage":"午后，小禾抱着几本书来到教室的图书角。她刚把书放下，就发现窗边的地上有一小摊水，最下面一本书的封面也湿了。她抬头看了看，原来窗户没关，刚才的雨飘了进来。小禾先关好窗，又拿来干布，轻轻吸去封面上的水。她想把湿书放到太阳下晒，却想起 const STORE='learning-trails-30-v1',VERSION=1,TOTAL=1800;
const app=document.getElementById('app');
const fresh=()=>({version:VERSION,mode:'home',route:0,set:'B',card:0,startedAt:null,phaseStart:null,finishedAt:null});
let state=fresh();
function valid(s){
 if(!s||s.version!==VERSION||!['home','intro','route','break','wrap','done'].includes(s.mode)||!Number.isInteger(s.route)||s.route<0||s.route>=DATA.length||!['A','B','C'].includes(s.set)||!Number.isInteger(s.card)||s.card<0||s.card>=DATA[s.route].sets[s.set].length)return false;
 if(s.mode==='home')return s.startedAt===null&&s.phaseStart===null&&s.finishedAt===null;
 if(!Number.isFinite(s.startedAt)||!Number.isFinite(s.phaseStart)||s.startedAt<=0||s.phaseStart<s.startedAt||s.phaseStart>Date.now())return false;
 return s.mode==='done'?Number.isFinite(s.finishedAt)&&s.finishedAt>=s.startedAt&&s.finishedAt<=Date.now():s.finishedAt===null;
}
try{const s=JSON.parse(localStorage.getItem(STORE));if(valid(s))state=Object.fromEntries(Object.keys(fresh()).map(k=>[k,s[k]]));}catch{}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const route=()=>DATA[state.route],cards=()=>route().sets[state.set],card=()=>cards()[state.card];
const elapsed=()=>state.startedAt===null?0:Math.max(0,((state.finishedAt??Date.now())-state.startedAt)/1000);
const totalLeft=()=>Math.max(0,TOTAL-elapsed());
const phaseLimit=()=>state.mode==='route'?route().minutes*60:60;
const phaseLeft=()=>Math.max(0,phaseLimit()-(Date.now()-state.phaseStart)/1000);
const running=()=>!['home','done'].includes(state.mode);
const totalExpired=()=>running()&&totalLeft()<=0;
const phaseExpired=()=>running()&&phaseLeft()<=0;
const clock=n=>{n=Math.ceil(Math.max(0,n));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;};
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch{}}
function button(action,label,classes='',extra=''){return `<button class="${classes}" data-action="${action}" ${extra}>${label}</button>`;}
function header(){return `<header><span class="brand">学力探险<span>30分钟版 · 语文数学</span></span>${running()?`<div class="row"><span class="clock" id="timer" aria-label="总剩余时间">${clock(totalLeft())}</span>${button('finish','结束探险','ghost small')}</div>`:''}</header>`;}
function notices(){return '<div id="time-notice" class="time-notice" role="status" hidden></div>';}
function home(){return `${header()}<section class="welcome"><p class="eyebrow">每个人都有自己的起点</p><h1 tabindex="-1">准备好，<br>发现新的本领。</h1><p class="lede">读一读，说一说，算一算，写一写。没学过的可以告诉老师，一起换个任务。</p>${button('start','开始探险','primary')}<p class="small muted">纸和笔 · 一本字典 · 和老师一起完成 · 约30分钟</p></section><div class="route-grid"><article><b>01 / 数学 · 12分钟</b><h2>数量里的秘密</h2><p>数与运算 · 数量与图形 · 数据与生活</p></article><article><b>02 / 语文 · 15分钟</b><h2>文字里的线索</h2><p>拼音 · 字词 · 阅读 · 短写</p></article></div>`;}
function intro(){return `${header()}${notices()}<section class="welcome"><p class="eyebrow">准备站 · 1分钟</p><h1 tabindex="-1">不用每一道都会。</h1><p class="lede">答案可以说出来，也可以写在纸上。做完后和老师一起选择下一步。遇到没学过的内容，可以换个任务。</p><p>中间会休息一下。离开这个页面时，时间也会继续走。</p>${button('intro-next','我准备好了','primary','data-newcontent')}</section>`;}
function visual(type){if(type==='rectangle')return '<svg class="question-visual" viewBox="0 0 380 165" role="img" aria-label="长方形，上边标6厘米，右边标3厘米"><rect x="55" y="45" width="210" height="105" fill="#edf1ff" stroke="#2c4be9" stroke-width="3"/><text x="130" y="30">6厘米</text><text x="280" y="103">3厘米</text></svg>';if(type==='shapes')return '<svg class="question-visual" viewBox="0 0 380 175" role="img" aria-label="图形A有两长边两短边和四个直角；图形B四条边相等且有四个直角"><rect x="20" y="30" width="160" height="85" fill="#edf1ff" stroke="#2c4be9" stroke-width="3"/><rect x="230" y="20" width="95" height="95" fill="#edf1ff" stroke="#2c4be9" stroke-width="3"/><text x="90" y="150">A</text><text x="270" y="150">B</text></svg>';return '';}
function table(rows){return `<table class="data-table"><thead><tr>${rows[0].map(c=>`<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
function taskPage(){const r=route(),q=card();return `${header()}<nav class="route-nav" aria-label="路线进度">${DATA.map((r,i)=>`<span class="${i===state.route?'active':''}" ${i===state.route?'aria-current="step"':''}>${i+1} ${esc(r.name)}</span>`).join('')}</nav>${notices()}<div class="row between"><div><p class="eyebrow">${r.subject} / ${r.name}</p><h1 class="task-title" tabindex="-1">${esc(q.title)}</h1></div><span id="stage-timer" class="stage-clock">本站剩余 ${clock(phaseLeft())}</span></div><p class="muted">可以口答或写在纸上。不会的、没学过的，都可以告诉老师。</p>${q.passage?`<article class="reading-text"><h2>图书角的小事</h2>${esc(q.passage)}</article>`:''}<article class="question">${q.table?table(q.table):''}<div class="prompt">${esc(q.prompt)}</div>${q.visual?visual(q.visual):''}</article><section class="next-choice"><p>和老师一起选择下一步。</p><div class="row">${state.card+1<cards().length?button('next-card','继续本组任务','primary','data-taskchange'):''}${button('next-route','去下一站',state.card+1<cards().length?'':'primary','data-newcontent')}${button('choose-A','换个任务','','data-taskchange')}${button('choose-C','继续挑战','','data-taskchange')}${state.set!=='B'?button('choose-B','回到本组','','data-taskchange'):''}</div><div id="choices" class="choices" hidden></div></section>`;}
function pausePage(){return `${header()}${notices()}<section class="welcome"><p class="eyebrow">活动站 · 1分钟</p><h1 tabindex="-1">伸伸手，看看远处。</h1><p class="lede">喝口水，让眼睛离开屏幕。接下来去文字的世界。</p><div class="break-clock" id="stage-timer">${clock(phaseLeft())}</div>${button('break-next','休息好了，继续','primary','data-newcontent')}</section>`;}
function wrap(){return `${header()}${notices()}<section class="welcome"><p class="eyebrow">交流站 · 1分钟</p><h1 tabindex="-1">今天发现了什么？</h1><p class="lede">哪个任务最有把握？哪个地方下次还想试试？</p>${button('complete','完成探险','primary')}</section>`;}
function done(){return `${header()}<section class="welcome"><p class="eyebrow">探险结束</p><h1 tabindex="-1">谢谢你的尝试。</h1><p class="lede">合上本子，活动一下。今天没有做完的，可以留到下一次。</p>${button('new','回到起点')}</section>`;}
function render(){app.innerHTML=({home,intro,route:taskPage,break:pausePage,wrap,done}[state.mode])();tick();const h=app.querySelector('h1');if(h)h.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function setPhase(mode){state.mode=mode;state.phaseStart=Date.now();save();render();}
function begin(){state={...fresh(),mode:'intro',startedAt:Date.now(),phaseStart:Date.now()};save();render();}
function startRoute(i){if(totalExpired())return;state.route=i;state.set='B';state.card=0;setPhase('route');}
function nextRoute(){if(state.mode!=='route'||totalExpired())return;if(state.route===2)setPhase('break');else if(state.route===DATA.length-1)setPhase('wrap');else startRoute(state.route+1);}
function choose(set){if(state.mode!=='route'||totalExpired()||phaseExpired())return;const el=document.getElementById('choices');el.hidden=false;el.innerHTML=`<p>一起选一个任务。没学过的可以先放一放；不需要全做。</p><div class="row">${route().sets[set].map((q,i)=>button('select',esc(q.title),'',`data-taskchange data-set="${set}" data-index="${i}"`)).join('')}${button('close-choices','收起')}</div>`;el.scrollIntoView?.({block:'nearest'});}
function finish(){state.mode='done';state.finishedAt=Date.now();save();render();}
app.addEventListener('click',e=>{
 const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;tick();
 if(a==='start'&&state.mode==='home')return begin();
 if(a==='new'&&state.mode==='done'){state=fresh();save();render();return;}
 if(a==='finish'&&running()){if(confirm('今天的探险先到这里吗？'))finish();return;}
 if(a==='complete'&&state.mode==='wrap')return finish();
 if(totalExpired())return;
 if(a==='intro-next'&&state.mode==='intro')return startRoute(0);
 if(a==='break-next'&&state.mode==='break')return startRoute(3);
 if(a==='next-route')return nextRoute();
 if(a==='close-choices'){document.getElementById('choices').hidden=true;return;}
 if(state.mode!=='route'||phaseExpired())return;
 if(a==='next-card'&&state.card+1<cards().length){state.card++;save();render();}
 else if(a.startsWith('choose-'))choose(a.slice(-1));
 else if(a==='select'){
   const set=b.dataset.set,index=Number(b.dataset.index);
   if(['A','B','C'].includes(set)&&Number.isInteger(index)&&index>=0&&index<route().sets[set].length){state.set=set;state.card=index;save();render();}
 }
});
function tick(){
 if(!running())return;
 const t=document.getElementById('timer');if(t)t.textContent=clock(totalLeft());
 const st=document.getElementById('stage-timer');if(st)st.textContent=(state.mode==='route'?'本站剩余 ':'')+clock(phaseLeft());
 const all=totalExpired(),phase=phaseExpired(),notice=document.getElementById('time-notice');
 if(notice){notice.hidden=!all&&!phase;const text=all?'30分钟到了。当前内容会留在这里，先停笔，和老师聊一聊，再点“结束探险”。':phase?(state.mode==='route'?'这一站的时间到了。题目留在这里，和老师商量后点“去下一站”。':state.mode==='intro'?'准备时间到了，可以进入第一站。':state.mode==='break'?'活动时间到了，准备好后继续。':'交流时间到了，可以完成探险。'):'';if(notice.textContent!==text)notice.textContent=text;}
 app.querySelectorAll('[data-newcontent]').forEach(b=>b.disabled=all);
 app.querySelectorAll('[data-taskchange]').forEach(b=>b.disabled=all||phase);
}
document.addEventListener('visibilitychange',tick);
render();setInterval(tick,1000);
</script></body></html>
